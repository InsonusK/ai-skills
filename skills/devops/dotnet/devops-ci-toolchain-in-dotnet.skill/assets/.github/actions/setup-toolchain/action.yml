# .github/actions/setup-toolchain/action.yml - installs the .NET toolchain version the project declares.
# Source: skill devops-ci-toolchain-in-dotnet. Copied verbatim; never edited in the project.
name: setup-toolchain
description: Install the .NET toolchain version the project declares
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    # Node for the living-doc renderer of the test report - every stack's report needs it.
    - uses: actions/setup-node@v4
      with:
        node-version-file: tools/livingdoc/package.json
