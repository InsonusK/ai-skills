  # Source: skill devops-package-publish-in-dotnet. The job `package` of release.yml.
  package:
    name: NuGet package
    needs: [version, test-kinds, test-kind]
    if: >-
      always() &&
      needs.version.result == 'success' && needs.version.outputs.deliver == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # A job's permissions replace the defaults: contents is listed, or the checkout fails.
    permissions:
      contents: read
      packages: write
    outputs:
      url: https://www.nuget.org/packages/{package-name}/${{ needs.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      # The command-line property wins over the props file, which stays as it is.
      - run: dotnet pack --configuration Release -p:Version=${{ needs.version.outputs.publish }} --output ./nupkg
      - name: Push to nuget.org
        if: github.ref_name == 'master'
        run: dotnet nuget push "./nupkg/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
      - name: Push to GitHub Packages
        if: github.ref_name != 'master'
        run: dotnet nuget push "./nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
