{{- if eq .Values.migrate.mode "job" }}
# This is Job mode — the chart's own condition (`migrate.mode == "job"`, the
# default) is the ONLY thing controlling whether this resource exists at
# all; it is never separately toggled from deployment.yaml's own
# MIGRATE_ON_START (that env var is derived from this same values key — see
# deployment.yaml), so the two migration modes cannot both be active for
# the same release by construction, not just by convention. See
# solution-go-db-migrations.skill/adr/migration-mode-per-platform.md.
#
# helm.sh/hook makes this genuinely block the release, natively — no
# `kubectl wait` step of your own: `helm install`/`helm upgrade` applies
# this Job, WAITS for it to reach Complete, and fails (rolling back, if
# `--atomic` is set) the whole release if it doesn't. See
# helm-deploy.example.md for what that looks like from the command line.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chart.name" . }}-migrate
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        role: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "chart.name" . }}-config
          env:
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.connectionStringKey }}
{{- end }}
