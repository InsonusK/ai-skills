# Real secret values are never committed here, and this template is not
# meant to be rendered with a real value passed through `--set`/values.yaml
# either — that still ends up in `helm get values` / release history in
# plaintext. Prefer creating the Secret out-of-band before the first
# install (see helm-deploy.example.md step 2) and leaving this file out of
# the chart entirely, or delete this template if your cluster's secret
# already comes from an external-secrets operator.
#
# Kept here only as the literal shape the Deployment's secretKeyRef expects
# (see values.yaml's secret.name/secret.connectionStringKey), so a reader
# of this chart alone can see what "already exists" is supposed to look
# like without cross-referencing k8s-secret.example.yml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.connectionStringKey }}: "REPLACE_ME_OUT_OF_BAND"
