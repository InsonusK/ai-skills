services:
  {service-name}:
    build:
      context: ..
      dockerfile: Dockerfile
    image: "{registry}/{service-name}:{version}"
    container_name: {service-name}
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__Default=${CONNECTION_STRING}
      - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - {service-name}-data:/app/data
    networks:
      - {service-name}-network

volumes:
  {service-name}-data:

networks:
  {service-name}-network:
