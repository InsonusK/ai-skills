# .github/actions/release/action.yml - builds the Python package and uploads it to PyPI (release) or TestPyPI (snapshot)
# Source: skill devops-release-package-in-python. Copied verbatim; never edited in the project.
name: release
description: builds the Python package and uploads it to PyPI (release) or TestPyPI (snapshot)
inputs:
  channel:
    description: check - build and publish nothing; snapshot - a build of develop; release - a build of master
    required: true
  version:
    description: The project's version, MAJOR.MINOR.PATCH
    required: true
  timestamp:
    description: UTC time of the run, YYYYMMDDhhmmss - what makes a snapshot's name unique
    required: true
  registry-token:
    description: PyPI API token
    required: false
  snapshot-registry-token:
    description: TestPyPI API token
    required: false
outputs:
  notes:
    description: Lines for the text of the GitHub Release
    value: ${{ steps.names.outputs.notes }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-toolchain
    - shell: bash
      run: python -m pip install build twine
    - id: names
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        TIMESTAMP: ${{ inputs.timestamp }}
      run: |
        name=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
        # PEP 440: a snapshot is {version}.dev{timestamp}, which sorts before the release;
        # {version}-{timestamp} would be read as a post-release.
        publish="$VERSION"; [ "$CHANNEL" = snapshot ] && publish="$VERSION.dev$TIMESTAMP"
        {
          echo "publish=$publish"
          echo "notes=- Package: https://pypi.org/project/$name/$VERSION/"
        } >> "$GITHUB_OUTPUT"
    # The build backend reads the version from the manifest, so a snapshot's version is written there.
    - if: inputs.channel == 'snapshot'
      shell: bash
      run: sed -i "s/^version = \"${{ inputs.version }}\"/version = \"${{ steps.names.outputs.publish }}\"/" pyproject.toml
    - shell: bash
      run: python -m build
    - if: inputs.channel == 'release'
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.registry-token }}
      run: twine upload dist/*
    - if: inputs.channel == 'snapshot'
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ inputs.snapshot-registry-token }}
      run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*
