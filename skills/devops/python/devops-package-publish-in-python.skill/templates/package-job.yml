  # Source: skill devops-package-publish-in-python. The job `package` of release.yml.
  package:
    name: Python package
    needs: [version, test-kinds, test-kind]
    if: >-
      always() &&
      needs.version.result == 'success' && needs.version.outputs.deliver == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      url: https://pypi.org/project/{package-name}/${{ needs.version.outputs.current }}/
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: python -m pip install build twine
      # A package version follows PEP 440: a snapshot is {version}.dev{timestamp}, which sorts
      # before the release; {version}-{timestamp} would be read as a post-release.
      - id: publish
        env:
          CURRENT: ${{ needs.version.outputs.current }}
          TIMESTAMP: ${{ needs.version.outputs.timestamp }}
        run: |
          if [ "$GITHUB_REF_NAME" = master ]; then
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          else
            echo "version=$CURRENT.dev$TIMESTAMP" >> "$GITHUB_OUTPUT"
          fi
      # The build backend reads the version from the manifest, so the snapshot version is written there.
      - if: github.ref_name != 'master'
        run: sed -i "s/^version = \"${{ needs.version.outputs.current }}\"/version = \"${{ steps.publish.outputs.version }}\"/" pyproject.toml
      - run: python -m build
      - name: Publish to PyPI
        if: github.ref_name == 'master'
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to TestPyPI
        if: github.ref_name != 'master'
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
