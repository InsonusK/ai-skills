  # Source: skill devops-app-release-in-go. The job `app` of release.yml.
  app:
    name: Release binaries
    needs: [version, test-kinds, test-kind]
    if: >-
      always() &&
      needs.version.result == 'success' && needs.version.outputs.deliver == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Cross-compile
        env:
          APP_NAME: {app-name}
          VERSION: ${{ needs.version.outputs.publish }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            goos="${target%%/*}"; goarch="${target##*/}"
            ext=""; [ "$goos" = windows ] && ext=".exe"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X {module-path}/internal/version.Version=$VERSION" \
              -o "dist/${APP_NAME}_${VERSION}_${goos}_${goarch}${ext}" {main-package}
          done
          ( cd dist && sha256sum * > "${APP_NAME}_${VERSION}_checksums.txt" )
      # release-*: the release job attaches it on master; on develop it stays with the run.
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
          if-no-files-found: error
