# .github/actions/setup-toolchain/action.yml - installs the Go toolchain version the project declares.
# Source: skill devops-ci-toolchain-in-go. Copied verbatim; never edited in the project.
name: setup-toolchain
description: Install the Go toolchain version the project declares
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    # Node for the living-doc renderer of the test report - every stack's report needs it.
    - uses: actions/setup-node@v4
      with:
        node-version-file: tools/livingdoc/package.json
