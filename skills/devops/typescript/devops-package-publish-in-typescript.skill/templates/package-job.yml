  # Source: skill devops-package-publish-in-typescript. The job `package` of release.yml.
  package:
    name: npm package
    needs: [version, test-kinds, test-kind]
    if: >-
      always() &&
      needs.version.result == 'success' && needs.version.outputs.deliver == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # A job's permissions replace the defaults: contents is listed, or the checkout fails.
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      url: https://www.npmjs.com/package/{package-name}/v/${{ needs.version.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: make init
      - run: npm run build --if-present
      # Stamped in the folder that is published, never committed: {package-dir} is "." for a
      # single package and the build output for a workspace library.
      - working-directory: {package-dir}
        run: npm pkg set version="${{ needs.version.outputs.publish }}"
      - name: Publish to npmjs.org
        if: github.ref_name == 'master'
        working-directory: {package-dir}
        run: npm publish --tag latest --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish to GitHub Packages
        if: github.ref_name != 'master'
        working-directory: {package-dir}
        run: |
          echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
