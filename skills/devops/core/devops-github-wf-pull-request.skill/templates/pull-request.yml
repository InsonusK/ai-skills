# .github/workflows/pull-request.yml - validates a pull request into develop or master.
# Source: skill devops-github-wf-pull-request. Written by assemble-workflow.sh; not edited by hand.
name: Pull request

on:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      test: ${{ steps.filter.outputs.test }}
      ci: ${{ steps.filter.outputs.ci }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/check-changes
        id: filter

  # Into master, a change of what is shipped must raise the version above master's.
  version-check:
    name: Version is raised
    needs: changes
    if: github.base_ref == 'master' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make version-check
        env:
          DELTA_BASE: origin/${{ github.base_ref }}

  # The README shows exactly the badges the project's tests declare; runs no test.
  readme-check:
    name: README badges
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.test == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-readme-check

  # The project's Makefile says which test kinds exist; this workflow never names one.
  test-kinds:
    name: List test kinds
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.test == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    outputs:
      kinds: ${{ steps.kinds.outputs.kinds }}
    steps:
      - uses: actions/checkout@v4
      - id: kinds
        run: echo "kinds=$(make -s test-kinds | cut -d' ' -f1 | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  test-kind:
    name: Test (${{ matrix.kind }})
    needs: test-kinds
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ fromJSON(needs.test-kinds.outputs.kinds) }}
    runs-on: ubuntu-latest
    env:
      # The one fact this workflow states about the run. No DELTA_BASE: every kind runs in
      # full, and a kind that only reports - mutation testing - skips itself.
      TEST_RUN_PURPOSE: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: make init
      - run: make test-kind-${{ matrix.kind }}

  # docker:begin
  # A Dockerfile that no longer builds is found here, not after the merge.
  image-build:
    name: Image builds
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "current=$(make -s version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ steps.version.outputs.current }}
  # docker:end

  # The one status branch protection requires: a skipped job passes, a failed or cancelled one does not.
  report:
    name: Pull request report
    needs:
      - changes
      - version-check
      - readme-check
      - test-kinds
      - test-kind
      - image-build # docker
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Changed"
            echo "$NEEDS" | jq -r '.changes.outputs | to_entries[] | "- \(.key): \(.value)"'
            echo "### Jobs"
            echo "$NEEDS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
