volumes:
  postgres-data:

networks:
  ai-skill-net:
    driver: bridge

services:
  app:
    image: mcr.microsoft.com/devcontainers/base:resolute

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity
    networks:
      - ai-skill-net
    depends_on:
      pg-db:
        condition: service_healthy
      redis-db:
        condition: service_started

  redis-db:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ai-skill-net
    ports:
      - "6379:6379"

  pg-db:
    image: postgres:latest
    restart: unless-stopped
    networks:
      - ai-skill-net

    # Health check ensures PostgreSQL is ready before dependent services start
    # This is critical for depends_on with condition: service_healthy to work properly
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Wait up to 5 seconds for response
      retries: 5 # Retry 5 times before marking as unhealthy
      start_period: 30s # Give PostgreSQL 30 seconds to start before health checks begin

    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      # Ensure that the variables in .env match the same variables in devcontainer.json
      - .env
    ports:
      - "5432:5432"
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
