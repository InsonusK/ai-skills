apiVersion: apps/v1
kind: Deployment
metadata:
  name: {service-name}
  namespace: {namespace}
  labels:
    app: {service-name}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: {service-name}
  template:
    metadata:
      labels:
        app: {service-name}
    spec:
      containers:
        - name: {service-name}
          image: "{registry}/{service-name}:{version}"
          ports:
            - containerPort: 8080
              name: http
            # The port of the health endpoints, never routed by the ingress.
            # Delete these two lines when the service serves them on 8080.
            - containerPort: {health-port}
              name: management
          envFrom:
            - configMapRef:
                name: {service-name}-config
          env:
            - name: CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {service-name}-secrets
                  key: connection-string
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: {health-port}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {health-port}
            initialDelaySeconds: 5
            periodSeconds: 10
