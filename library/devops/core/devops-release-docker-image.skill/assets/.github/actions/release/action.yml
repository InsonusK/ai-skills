# .github/actions/release/action.yml - builds the project's Docker image and pushes it to ghcr.io
# Source: skill devops-release-docker-image. Copied verbatim; never edited in the project.
name: release
description: builds the project's Docker image and pushes it to ghcr.io
inputs:
  channel:
    description: check - build and publish nothing; snapshot - a build of develop; release - a build of master
    required: true
  version:
    description: The project's version, MAJOR.MINOR.PATCH
    required: true
  timestamp:
    description: UTC time of the run, YYYYMMDDhhmmss - what makes a snapshot's name unique
    required: true
  registry-token:
    description: Not used - the image is pushed with the workflow's own token
    required: false
  snapshot-registry-token:
    description: Not used
    required: false
outputs:
  notes:
    description: Lines for the text of the GitHub Release
    value: ${{ steps.names.outputs.notes }}
runs:
  using: composite
  steps:
    - id: names
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
        TIMESTAMP: ${{ inputs.timestamp }}
      run: |
        # An image reference is lowercase; a repository name need not be.
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        case "$CHANNEL" in
          release)  publish="$VERSION";            tags="$image:$VERSION"$'\n'"$image:latest" ;;
          snapshot) publish="$VERSION-$TIMESTAMP"; tags="$image:$publish" ;;
          *)        publish="$VERSION";            tags="$image:check" ;;
        esac
        {
          echo "publish=$publish"
          echo "tags<<EOF"; echo "$tags"; echo "EOF"
          echo "notes=- Docker image: \`$image:$VERSION\`"
        } >> "$GITHUB_OUTPUT"
    - uses: docker/login-action@v3
      if: inputs.channel != 'check'
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # The default builder cannot write attestations.
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ inputs.channel != 'check' }}
        tags: ${{ steps.names.outputs.tags }}
        build-args: VERSION=${{ steps.names.outputs.publish }}
        provenance: ${{ inputs.channel == 'release' && 'mode=max' || 'false' }}
        sbom: ${{ inputs.channel == 'release' }}
