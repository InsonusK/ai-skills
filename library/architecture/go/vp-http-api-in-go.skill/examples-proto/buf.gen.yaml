version: v2
# Only the service's own contracts: buf.yaml may also name a module of consumed ones.
inputs:
  - directory: docs/integration/api
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/api
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/api
    opt: paths=source_relative
  # disable_default_responses: the spec lists only the statuses the proto file
  # names (201 is not doubled by a generated 200); enable_rpc_deprecation:
  # `option deprecated = true` marks the operation deprecated in the spec.
  - local: ["go", "tool", "protoc-gen-openapiv2"]
    out: docs/integration/api
    opt:
      - disable_default_responses=true
      - enable_rpc_deprecation=true
