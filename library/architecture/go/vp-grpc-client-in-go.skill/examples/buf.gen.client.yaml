version: v2
# Only the consumed contracts: the gRPC API's own are generated by buf.gen.yaml.
# The directory is its own module; it needs no buf.yaml, and a buf.yaml of the
# gRPC API changes nothing here.
inputs:
  - directory: docs/integration/client
# The provider's go_package names its own module; managed mode replaces it,
# one line per consumed contract, so the copied file stays unchanged and its
# code lands in gen/client/{api-name} as package {api-name}.
managed:
  enabled: true
  override:
    - file_option: go_package
      path: todo
      value: github.com/example/todo/gen/client/todo
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/client
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/client
    opt: paths=source_relative
