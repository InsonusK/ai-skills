[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "todo"
version = "0.1.0"
description = "The base plateau of the architecture catalog with the logging variation point: a to-do planner"
requires-python = ">=3.13"
dependencies = [
    # the mask walks proto messages by their descriptors
    "protobuf==7.36.2",
]

[project.optional-dependencies]
# The scenarios and the type check. A real project adds its testing contract
# (coverage, mutation, reports) per solution-conformance-testing-in-python.
dev = [
    "pytest==9.1.1",
    "pytest-bdd==9.0.0",
    "mypy==2.4.0",
    # the scenarios: masking.proto compiled at test time, pydantic models as
    # the types with a JSON form, the type stubs of protobuf
    "grpcio-tools==1.84.0",
    "pydantic==2.14.1",
    "types-protobuf==7.35.1.20260906",
]

[project.scripts]
todo = "todo.main:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.test", "*.test.*"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
addopts = "--import-mode=importlib"
markers = [
    "status/todo: planned, not implemented yet - excluded from the run",
    "status/broken: implemented, known to fail - excluded from the run",
    "category/happy", "category/boundary", "category/negative", "category/error", "category/security",
    "type/domain", "type/service", "type/api/cli", "type/tech-check",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# grpcio-tools compiles masking.proto in the scenarios; it ships no type information.
module = "grpc_tools"
ignore_missing_imports = true

# The mutation run of the masked formatter (leak-catalog.md of skill vp-logging):
# every source is copied, only log/masked is mutated, its scenarios decide.
[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = [
    "src/todo/api/*", "src/todo/command/*", "src/todo/config/*", "src/todo/domain/*",
    "src/todo/log/__init__.py", "src/todo/log/records.py", "src/todo/log/request_id.py", "src/todo/log/test/*",
    "src/todo/log/masked/test/*", "src/todo/__init__.py", "src/todo/__main__.py", "src/todo/main.py",
]
pytest_add_cli_args_test_selection = ["src/todo/log/masked"]
