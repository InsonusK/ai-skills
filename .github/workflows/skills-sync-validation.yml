name: Skills sync validation

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'skills/**'
      - 'test/**'
      - '.github/workflows/skills-sync-validation.yml'

jobs:
  sync-ubuntu:
    name: Validate sync on Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ai-skill-manager
        run: curl -fsSL https://raw.githubusercontent.com/InsonusK/go-ai-skill-manage/master/scripts/install.sh | sh

      - name: Run sync validation
        run: |
          chmod +x test.sh
          ./test.sh

  sync-windows:
    name: Validate sync on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: test
        shell: pwsh
    steps:
      - name: Enable Git long paths
        run: git config --global core.longpaths true
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ai-skill-manager
        run: |
          $env:AISM_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'aism'
          irm https://raw.githubusercontent.com/InsonusK/go-ai-skill-manage/master/scripts/install.ps1 | iex
          $env:AISM_INSTALL_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run sync validation
        run: .\test.ps1
