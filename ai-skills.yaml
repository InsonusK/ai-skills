sources:
  - path: https://github.com/InsonusK/ai-skills.git
    type: github
    tree: master
    subpath:
      - library/common-workflow/work-in-git-tree.skill.md
      - library/common-workflow/mermaid-diagram.skill.md
      - library/common-workflow/architecture/design
      - library/common-workflow/bulk-authoring-harness.skill/bulk-authoring-harness.skill.md
      - library/common-workflow/documentation
      - library/design
      - skills                          # this repository's own skills
      
  - path: https://github.com/InsonusK/ai-skill-graph-draw.git
    type: github
    tree: master
    subpath:
      - docs/skills
      
target:
  default: {}                          # .agents/skills
  claude:                              # .claude/skills
    adapters: [claude-property-adapter]
settings:
  remove_orphans: true                 # удалять скилы, которых больше нет в источниках
  add_relations: true                  # подтягивать скилы, на которые ссылаются выбранные