sources:
  - path: ./..
    type: local
    subpath:
      - library/python
      - library/dotnet
      - library/devops
      - library/common-workflow
      - library/angular
      - library/go
      - library/design
      - library/testing
      - library/architecture
      - library/develop
  - path: ./../skills
    type: local

target:
  default:
    path: tmp/.agents/skills
  claude:
    path: tmp/.claude/skills
    adapters: [claude-property-adapter]

settings:
  remove_orphans: true
  dry_run: false
  validation:
    exclude_from_checks: [examples, examples-proto, templates]
