sources:
  - path: ./..
    type: local
    subpath:
      - skills/python
      - skills/dotnet
      - skills/devops
      - skills/common-workflow
      - skills/angular
      - skills/go
      - skills/design
      - skills/testing

target:
  default:
    path: tmp/.agents/skills
  claude:
    path: tmp/.claude/skills
    adapters: [claude-property-adapter]

settings:
  remove_orphans: true
  dry_run: false
  validation:
    exclude_from_checks: [examples, templates]
